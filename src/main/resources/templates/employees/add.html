<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1 class="mb-3">Add Employee</h1>

  <form th:action="@{/employees/add}" th:object="${employeeForm}" method="post" class="col-md-6">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
             id="name" type="text" th:field="*{name}" placeholder="Employee name">
      <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"
             id="email" type="email" th:field="*{email}" placeholder="employee@example.com">
      <div class="invalid-feedback" th:errors="*{email}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="department">Department</label>
      <select class="form-select" th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid' : ''"
              id="department" th:field="*{departmentId}">
        <option value="">-- Select Department --</option>
        <option th:each="department : ${departments}"
                th:value="${department.id}" th:text="${department.name}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{departmentId}"></div>
    </div>

    <button class="btn btn-success" type="submit">Save</button>
    <a class="btn btn-secondary" th:href="@{/employees/list}">Back</a>
  </form>
</body>
</html>
