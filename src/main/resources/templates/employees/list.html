<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1 class="mb-3">Employees</h1>

  <form class="row g-2 mb-3" th:action="@{/employees/search}" method="get">
    <div class="col-md-4">
      <input class="form-control" type="text" name="name" th:value="${name}" placeholder="Search by name">
    </div>
    <div class="col-md-4">
      <input class="form-control" type="text" name="department" th:value="${department}" placeholder="Search by department">
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary" type="submit">Search</button>
      <a class="btn btn-success" th:href="@{/employees/add}">Add Employee</a>
    </div>
  </form>

  <table class="table table-striped table-bordered">
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th></tr></thead>
    <tbody>
      <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.email}"></td>
        <td th:text="${employee.department.name}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="4" class="text-center text-muted">No employees found.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
